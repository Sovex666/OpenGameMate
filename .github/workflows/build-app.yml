name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore .\OpenGameMate.sln
          dotnet build .\OpenGameMate.sln -c Release --no-restore
          dotnet test .\tests\OpenGameMate.Tests\OpenGameMate.Tests.csproj -c Release --no-build

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build portable package and installer
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1 -InnoCompiler $env:ISCC `
            -PortableOutputDirectory "$env:GITHUB_WORKSPACE\artifacts\portable" `
            -InstallerOutputDirectory "$env:GITHUB_WORKSPACE\artifacts\installer"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts\installer -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Tee-Object -FilePath artifacts\installer\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGameMate-portable-win-x64
          path: artifacts/portable/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: OpenGameMate-installer
          path: artifacts/installer/
          if-no-files-found: error
